name: Build synthetic patient-risk ML artifact
on:
  push:
    branches: [feature/substance-risk-ml-v2]
    paths:
      - 'healthcareguard_patient_ml_v2/build_dataset.py.gz.b64'
      - 'healthcareguard_patient_ml_v2/train_patient_risk_model.py'
      - '.github/workflows/build-patient-risk-ml.yml'
      - 'healthcareguard/patient_risk_ml.py'
      - 'tests/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  train-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install pinned model dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 joblib==1.5.3 pytest==9.0.2
      - name: Restore deterministic dataset generator
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          src = Path('healthcareguard_patient_ml_v2/build_dataset.py.gz.b64').read_text().strip()
          Path('healthcareguard_patient_ml_v2/build_dataset.py').write_bytes(gzip.decompress(base64.b64decode(src)))
          PY
      - name: Generate synthetic dataset
        run: python healthcareguard_patient_ml_v2/build_dataset.py
      - name: Train offline and save inference artifact
        run: |
          python healthcareguard_patient_ml_v2/train_patient_risk_model.py \
            --data healthcareguard_patient_ml_v2/patient_risk_substance_dataset.csv \
            --model healthcareguard/patient_risk_substance_model.joblib \
            --report healthcareguard/patient_risk_evaluation.json
      - name: Verify generated artifact
        run: |
          python - <<'PY'
          import joblib, json, pandas as pd
          from pathlib import Path
          data = pd.read_csv('healthcareguard_patient_ml_v2/patient_risk_substance_dataset.csv')
          bundle = joblib.load('healthcareguard/patient_risk_substance_model.joblib')
          assert len(data) == 2432, len(data)
          assert data.category.nunique() == 19
          assert set(bundle) >= {'risk_model', 'category_model', 'metadata'}
          assert bundle['metadata']['risk_threshold'] == 0.60
          report = json.loads(Path('healthcareguard/patient_risk_evaluation.json').read_text())
          assert report['dataset_rows'] == 2432
          print('Dataset and model artifact verified:', len(data), 'rows,', data.category.nunique(), 'categories')
          PY
      - name: Commit generated model, dataset and evaluation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add healthcareguard_patient_ml_v2/patient_risk_substance_dataset.csv healthcareguard/patient_risk_substance_model.joblib healthcareguard/patient_risk_evaluation.json
          if ! git diff --cached --quiet; then
            git commit -m 'Build patient-risk ML artifact from synthetic dataset'
            git push
          fi
